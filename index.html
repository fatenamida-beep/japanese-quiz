<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코인 블록 퀴즈 게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky1:#5fb7ff; --sky2:#bfe6ff; --grass:#5cc04a; --dirt:#b8743a;
    --block:#f4b223; --block-d:#c57f0a; --brick:#d8692e; --ink:#1f2a44;
    --card:#fffdf6; --red:#e8453c; --green:#2fa84f; --blue:#2f7fe0; --pink:#ffb3c8; --pink-d:#c0392b; --butter:#ffd84a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:'Jua','M PLUS Rounded 1c',system-ui,sans-serif;color:var(--ink);
    background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 70%,#e9f7ff 100%);
    min-height:100vh;overflow-x:hidden;
  }
  .jp{font-family:'M PLUS Rounded 1c','Jua',sans-serif;font-weight:800}
  /* decorative clouds + hills */
  .cloud{position:fixed;background:#fff;border-radius:60px;opacity:.9;z-index:0}
  .cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
  .c1{width:160px;height:46px;top:70px;left:4%}.c1::before{width:70px;height:70px;top:-34px;left:22px}.c1::after{width:56px;height:56px;top:-24px;left:78px}
  .c2{width:200px;height:54px;top:140px;right:6%}.c2::before{width:86px;height:86px;top:-44px;left:30px}.c2::after{width:66px;height:66px;top:-30px;left:104px}
  .ground{position:fixed;left:0;right:0;bottom:0;height:46px;z-index:0;
    background:linear-gradient(180deg,var(--grass) 0 12px,var(--dirt) 12px);
    box-shadow:0 -4px 0 #3f9a33 inset}
  .ground::after{content:"";position:absolute;inset:16px 0 0 0;
    background:repeating-linear-gradient(90deg,transparent 0 38px,rgba(0,0,0,.12) 38px 40px)}
  .hill{position:fixed;bottom:40px;z-index:0;border-radius:50% 50% 0 0;background:#7fd36a;border:4px solid #3f9a33;border-bottom:none}
  .h1{width:220px;height:130px;left:-40px}.h2{width:160px;height:90px;right:30px}

  .app{position:relative;z-index:1;display:grid;grid-template-columns:1fr 300px;gap:18px;
       padding:16px 20px 70px;max-width:1500px;margin:0 auto}
  header{grid-column:1/-1;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  h1{margin:0;font-size:clamp(26px,3.4vw,44px);color:#fff;letter-spacing:1px;
     text-shadow:3px 3px 0 #c0392b,-2px -2px 0 #c0392b,2px -2px 0 #c0392b,-2px 2px 0 #c0392b,5px 6px 0 rgba(0,0,0,.25)}
  .subtitle{background:#fff;border:3px solid var(--ink);border-radius:10px;padding:4px 12px;font-size:18px}
  .tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  button{font-family:inherit;cursor:pointer}
  .btn{border:3px solid var(--ink);background:#fff;border-radius:12px;padding:8px 14px;font-size:17px;
       box-shadow:0 4px 0 var(--ink);transition:transform .08s}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
  .btn.primary{background:var(--red);color:#fff}
  .btn.ok{background:var(--green);color:#fff}
  .btn.no{background:#8a94a8;color:#fff}
  .btn.blue{background:var(--blue);color:#fff}
  .btn:disabled{opacity:.4;cursor:not-allowed}

  /* board */
  .board{display:grid;gap:14px;align-content:start;
         grid-template-columns:repeat(var(--cols,6),1fr);
         width:100%;max-width:calc((100vh - 130px) / var(--rows,5) * var(--cols,6));margin:0 auto}
  .tile{aspect-ratio:1/1;border:4px solid #5a3a06;border-radius:10px;position:relative;
        background:linear-gradient(145deg,#ffd257,var(--block) 55%,var(--block-d));
        box-shadow:inset -6px -6px 0 rgba(0,0,0,.18),inset 6px 6px 0 rgba(255,255,255,.35),0 6px 0 #5a3a06;
        display:flex;align-items:center;justify-content:center;font-size:clamp(26px,3.6vw,52px);color:#fff;
        text-shadow:3px 3px 0 #5a3a06;transition:transform .12s}
  .tile::before,.tile::after{content:"";position:absolute;width:8px;height:8px;border-radius:2px;background:#5a3a06;opacity:.55}
  .tile::before{top:8px;left:8px}
  .tile::after{bottom:8px;right:8px}
  .tile:hover:not(.used){transform:translateY(-6px)}
  .tile.used{background:linear-gradient(145deg,#c98a59,var(--brick) 60%,#9a4a1d);cursor:default;color:transparent;text-shadow:none;
             box-shadow:inset -6px -6px 0 rgba(0,0,0,.2),0 3px 0 #5a3a06}
  .tile.used .done{position:absolute;font-size:clamp(20px,2.6vw,36px);color:#fff;text-shadow:none;opacity:.95}
  .tile.bump{animation:bump .35s}
  @keyframes bump{40%{transform:translateY(-16px)}100%{transform:none}}

  /* teams */
  .side{display:flex;flex-direction:column;gap:8px}
  .turnbox{background:#fff;border:4px solid var(--ink);border-radius:14px;padding:6px 12px;text-align:center;font-size:18px}
  .turnbox b{display:block;font-size:28px;color:var(--red)}
  .team{background:var(--card);border:4px solid var(--ink);border-radius:14px;padding:5px 10px;
        display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 8px;position:relative;
        box-shadow:0 4px 0 var(--ink)}
  .team.now{background:#fff2b8;outline:5px solid var(--red);outline-offset:2px}
  .team .nm{font-size:20px;display:flex;align-items:center;gap:6px}
  .team .sc{font-size:30px;color:var(--blue);text-align:right;min-width:70px}
  .team .adj{grid-column:1/-1;display:flex;gap:6px}
  .team .adj button{border:2px solid var(--ink);background:#fff;border-radius:8px;font-size:13px;padding:2px 8px}
  .shield{font-size:18px}
  .sc.pop{animation:pop .5s}
  @keyframes pop{30%{transform:scale(1.4);color:var(--red)}}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(15,25,50,.55);z-index:20;display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--card);border:5px solid var(--ink);border-radius:20px;box-shadow:0 10px 0 var(--ink);
         width:min(980px,100%);max-height:92vh;overflow:auto;padding:26px 30px;text-align:center;position:relative;animation:zoom .25s}
  @keyframes zoom{from{transform:scale(.85);opacity:0}}
  .qtype{display:inline-block;background:var(--red);color:#fff;border-radius:999px;padding:6px 20px;font-size:24px;margin-bottom:10px}
  .qnum{position:absolute;top:14px;left:20px;font-size:20px;opacity:.6}
  .qtext{font-size:clamp(34px,5.4vw,70px);line-height:1.35;margin:16px 0 18px;word-break:keep-all}
  .answer{font-size:clamp(30px,4.6vw,60px);color:var(--red);background:#fff;border:4px dashed var(--blue);border-radius:16px;
          padding:12px 18px;margin:8px auto 18px;display:none;line-height:1.35;word-break:keep-all}
  .answer.show{display:block;animation:zoom .25s}
  .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .row .btn{font-size:22px;padding:10px 22px}
  .rw-icon{font-size:clamp(70px,11vw,140px);line-height:1.1;margin:6px 0;animation:rise .5s}
  @keyframes rise{from{transform:translateY(40px) scale(.6);opacity:0}}
  .rw-title{font-size:clamp(30px,4.6vw,56px);margin:4px 0}
  .rw-desc{font-size:22px;margin-bottom:16px;opacity:.85}
  .mystery{display:flex;gap:20px;justify-content:center;margin:16px 0}
  .mbox{width:clamp(100px,16vw,170px);aspect-ratio:1/1;font-size:clamp(50px,8vw,100px)}
  .mbox.reveal{color:inherit;text-shadow:none;background:#fff;border-color:#999}
  .mbox.pick{outline:6px solid var(--red);outline-offset:4px}
  .targets{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0 16px}
  .targets .btn{font-size:22px}

  /* settings */
  .modal.left{text-align:left}
  .modal h2{margin:0 0 10px;font-size:30px}
  .field{margin:12px 0}
  .field label{display:block;font-size:19px;margin-bottom:6px}
  .field input,.field textarea,.field select{width:100%;font-family:'M PLUS Rounded 1c',sans-serif;font-size:16px;border:3px solid var(--ink);border-radius:10px;padding:8px 10px;background:#fff}
  .field textarea{min-height:300px;line-height:1.6;font-weight:500}
  .hint{font-size:15px;opacity:.75;line-height:1.6;background:#eef6ff;border-radius:10px;padding:8px 12px;font-family:'M PLUS Rounded 1c',sans-serif}
  .hint code{background:#fff;border:1px solid #bcd;border-radius:5px;padding:0 5px}
  .teamnames{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
  .itemlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;text-align:left;margin:10px 0}
  .itemlist div{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:8px 10px;font-size:19px}
  .itemlist span{font-size:30px;margin-right:6px}
  .rank{font-size:30px;margin:8px 0}
  .setcard{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:10px 14px;margin:8px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .setcard .nm{font-size:22px;flex:1;min-width:180px}
  .setcard .meta{font-size:14px;opacity:.65;display:block;font-family:'M PLUS Rounded 1c',sans-serif}
  .setcard .btn{font-size:15px;padding:5px 12px}
  .setcard.cur{background:#fff0f6;border-color:var(--pink-d)}
  .saverow{display:flex;gap:8px;flex-wrap:wrap}.saverow input{flex:1;min-width:200px}
  .x{position:absolute;top:10px;right:14px;border:none;background:none;font-size:30px}
  .toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;z-index:50;font-size:18px;display:none}

  @media (max-width:900px){
    .app{grid-template-columns:1fr}
    .side{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
    .turnbox{grid-column:1/-1}
  }
</style>
</head>
<body>
<div class="cloud c1"></div><div class="cloud c2"></div>
<div class="hill h1"></div><div class="hill h2"></div><div class="ground"></div>

<div class="app">
  <header>
    <h1 id="title">코인 블록 퀴즈</h1>
    <div class="subtitle jp" id="subtitle"></div>
    <div class="tools">
      <button class="btn" onclick="openHelp()">❔ 규칙</button>
      <button class="btn" id="undoBtn" onclick="undo()">↩ 되돌리기</button>
      <button class="btn" onclick="openSets()" style="background:var(--butter)">📚 문제 세트</button>
      <button class="btn blue" onclick="openSettings()">✏️ 문제·모둠 설정</button>
      <button class="btn primary" onclick="confirmNewGame()">🔄 새 게임</button>
    </div>
  </header>
  <main class="board" id="board"></main>
  <aside class="side" id="side"></aside>
</div>

<!-- play modal -->
<div class="overlay" id="playOv"><div class="modal" id="play"></div></div>
<!-- settings / help / misc -->
<div class="overlay" id="miscOv"><div class="modal left" id="misc"></div></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   ✏️ 기본 문제 목록 — 여기만 고치면 문제가 바뀝니다.
   (게임 화면의 [문제·모둠 설정]에서 바로 고쳐도 됩니다.)
   한 줄에 문제 하나:   유형 | 문제 | 정답
   · 줄바꿈이 필요하면 "/" 를 넣으세요.
   · 유형을 빼고  문제 | 정답  만 써도 됩니다.
   · # 으로 시작하는 줄은 무시됩니다.
   ========================================================= */
const DEFAULT_QUESTIONS = `
た형으로 바꾸면? | 行く | 行った
일본어로 말하면? | 일본에 간 적이 있습니까? | 日本へ行ったことが/ありますか。
た형으로 바꾸면? | 泳ぐ | 泳いだ
빈칸에 알맞은 말은? | 飛行機に（乗る）/ことがありますか。 | 乗った
대답해 보세요! | 芸能人に会ったことがありますか。/→ 네, 한 번 있습니다. | はい、一度あります。
조언해 주세요! | 「調子が悪いです。」/→ 병원에 가는 편이 좋아요. | 病院へ/行った方がいいです。
한자 읽기! | 飛行機 | ひこうき
일본어로 말하면? | 푹 쉬는 편이 좋습니다. | ゆっくり/休んだ方がいいです。
た형으로 바꾸면? | 来る | 来た（きた）
한국어로 해석하면? | 日本語の勉強を/始めたばかりです。 | 일본어 공부를/막 시작했습니다.
빈칸에 알맞은 말은? | 手紙より電話を（する）/方がいいです。 | した
쉬어가기 퀴즈! | 바다를 주제로 한/도쿄 디즈니리조트의 테마파크는? | 도쿄 디즈니씨
일본어로 말하면? | 지금 막 일어났습니다. | 今/起きたばかりです。
한자 읽기! | 美術館 | びじゅつかん
틀린 곳을 고치면? | 日本へ行いたことが/あります。 | 行いた → 行った
대답해 보세요! | アメリカへ行ったことがありますか。/→ 아니요, 없습니다. | いいえ、ありません。
た형으로 바꾸면? | 飲む | 飲んだ
한국어로 해석하면? | タクシーより/バスに乗った方がいいです。 | 택시보다 버스를/타는 편이 좋습니다.
일본어로 말하면? | 이 소설을 읽은 적이 있습니다. | この小説を/読んだことがあります。
빈칸에 알맞은 말은? | 空港に（着く）/ばかりです。 | 着いた
조언해 주세요! | 「調子が悪いです。」/→ 약을 먹는 편이 좋아요. | 薬を/飲んだ方がいいです。
쉬어가기 퀴즈! | 유니버설 스튜디오 재팬이/있는 도시는? | 오사카（大阪）
한자 읽기! | 表現 | ひょうげん
た형으로 바꾸면? | 帰る | 帰った
た형으로 바꾸면? | 書く | 書いた
た형으로 바꾸면? | 待つ | 待った
た형으로 바꾸면? | 話す | 話した
た형으로 바꾸면? | 遊ぶ | 遊んだ
한자 읽기! | 会話 | かいわ
일본어로 말하면? | 2년 전에 간 적이 있습니다. | 2年前に/行ったことがあります。
`;

const DEFAULT_SETTINGS = {
  title: '코인 블록 퀴즈',
  subtitle: '4과  日本へ行ったことがありますか。',
  teams: ['1모둠','2모둠','3모둠','4모둠','5모둠','6모둠'],
  questions: DEFAULT_QUESTIONS.trim(),
  shuffle: false
};

/* ---------- 아이템 정의 (점수·확률은 여기서 조정) ---------- */
const ITEMS = {
  coin1:{icon:'🪙',              title:'+10점',        desc:'코인 1개!',                 kind:'coin', pts:10},
  coin2:{icon:'🪙🪙',            title:'+20점',        desc:'코인 2개!',                 kind:'coin', pts:20},
  coin3:{icon:'🪙🪙🪙',          title:'+30점',        desc:'코인 3개!',                 kind:'coin', pts:30},
  coin4:{icon:'🪙🪙🪙🪙',        title:'+40점',        desc:'코인 4개!',                 kind:'coin', pts:40},
  coin5:{icon:'🪙🪙🪙🪙🪙',      title:'+50점',        desc:'코인 5개! 대박!',           kind:'coin', pts:50},
  fire: {icon:'🔥',              title:'10점 뺏기',     desc:'다른 모둠에서 10점을 뺏어 와요', kind:'steal', pts:10},
  bolt: {icon:'⚡',              title:'20점 뺏기',     desc:'다른 모둠에서 20점을 뺏어 와요', kind:'steal', pts:20},
  star: {icon:'🌟',              title:'무적 별!',      desc:'이제부터 점수를 절대 뺏기지 않아요', kind:'shield'},
  bomb: {icon:'💣',              title:'펑! 0점',       desc:'우리 모둠 점수가 0점이 돼요',   kind:'zero'},
  ghost:{icon:'👻',              title:'으악! 0점',     desc:'우리 모둠 점수가 0점이 돼요',   kind:'zero'},
  storm:{icon:'🌪️',              title:'휘잉~ 0점',     desc:'우리 모둠 점수가 0점이 돼요',   kind:'zero'},
  mystery:{icon:'❓❓❓',         title:'물음표 블록 3개!', desc:'하나를 골라 보세요', kind:'mystery'}
};
/* 블록 30개 기준 비율 — 블록 수가 달라지면 비율대로 자동 조정 */
const DECK_RATIO = {coin1:3,coin2:4,coin3:5,coin4:3,coin5:2,fire:4,bolt:1,star:1,bomb:1,ghost:1,storm:1,mystery:4};
/* 물음표 블록 안에 들어갈 수 있는 것들 (숫자 = 나올 확률 가중치) */
const MYSTERY_POOL = {coin1:2,coin2:2,coin3:2,coin5:1,fire:2,bolt:1,bomb:1,ghost:1,storm:1};

/* ---------- 저장 (브라우저에만 저장됨) ---------- */
const KEY='coinBlockQuiz.v1';
function load(){ try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s&&s.settings) return s; }catch(e){} return null; }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }

let S = load() || {settings:structuredClone(DEFAULT_SETTINGS), game:null};
if(S.settings.title==='몽글몽글 블록 퀴즈') S.settings.title=DEFAULT_SETTINGS.title;
let history=[];

/* ---------- utils ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>esc(s).split('/').map(x=>x.trim()).join('<br>');
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function weighted(pool){const e=Object.entries(pool);let t=e.reduce((s,[,w])=>s+w,0),r=Math.random()*t;for(const[k,w]of e){if((r-=w)<0)return k;}return e[0][0];}
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',1800);}

function parseQuestions(text){
  return text.split('\n').map(l=>l.trim()).filter(l=>l&&!l.startsWith('#')).map(l=>{
    const p=l.split('|').map(x=>x.trim());
    if(p.length>=3) return {type:p[0],q:p[1],a:p.slice(2).join(' | ')};
    if(p.length===2) return {type:'문제',q:p[0],a:p[1]};
    return {type:'문제',q:p[0],a:''};
  });
}

function buildDeck(n){
  const total=Object.values(DECK_RATIO).reduce((a,b)=>a+b,0);
  let deck=[];
  for(const[k,w]of Object.entries(DECK_RATIO)){ const c=Math.round(w*n/total); for(let i=0;i<c;i++)deck.push(k); }
  const coins=['coin1','coin2','coin3','coin4','coin5'];
  while(deck.length<n) deck.push(coins[Math.floor(Math.random()*coins.length)]);
  shuffle(deck); return deck.slice(0,n);
}

function newGame(){
  const qs=parseQuestions(S.settings.questions);
  if(S.settings.shuffle) shuffle(qs);
  const n=qs.length, t=S.settings.teams.length;
  S.game={qs, deck:buildDeck(n), used:Array(n).fill(false), scores:Array(t).fill(0), shield:Array(t).fill(false), turn:0};
  history=[]; save(); render();
}
function confirmNewGame(){
  showMisc(`<h2>🔄 새 게임을 시작할까요?</h2><p style="font-size:20px">점수와 열린 블록이 모두 초기화되고, 아이템 위치도 새로 섞여요.</p>

/* ---------- undo ---------- */
function snap(){ history.push(JSON.stringify(S.game)); if(history.length>50)history.shift(); }
function undo(){ if(!history.length){toast('되돌릴 기록이 없어요');return;} S.game=JSON.parse(history.pop()); save(); render(); toast('한 단계 되돌렸어요'); }

/* ---------- render ---------- */
function render(){
  const g=S.game, st=S.settings;
  $('title').textContent=st.title||'코인 블록 퀴즈';
  document.title=st.title||'코인 블록 퀴즈';
  $('subtitle').textContent=st.subtitle||''; $('subtitle').style.display=st.subtitle?'':'none';
  const n=g.qs.length, cols=n<=12?4:n<=20?5:n<=30?6:n<=42?7:8;
  const b=$('board'); b.style.setProperty('--cols',cols); b.style.setProperty('--rows',Math.ceil(n/cols));
  b.innerHTML=g.qs.map((q,i)=>`<button class="tile ${g.used[i]?'used':''}" ${g.used[i]?'disabled':''} onclick="openQ(${i},this)" aria-label="${i+1}번">${i+1}${g.used[i]?'<span class="done">✔</span>':''}</button>`).join('');
  $('side').innerHTML=`<div class="turnbox">지금 차례<b>${esc(st.teams[g.turn]||'')}</b><span style="font-size:15px;opacity:.7">남은 블록 ${g.used.filter(x=>!x).length}개</span></div>`+
    st.teams.map((t,i)=>`<div class="team ${i===g.turn?'now':''}">
      <div class="nm">${esc(t)} ${g.shield[i]?'<span class="shield" title="무적">🌟</span>':''}</div>
      <div class="sc" id="sc${i}">${g.scores[i]}</div>
      <div class="adj"><button onclick="adj(${i},10)">+10</button><button onclick="adj(${i},-10)">−10</button><button onclick="setTurn(${i})">이 모둠 차례로</button></div>
    </div>`).join('');
  $('undoBtn').disabled=!history.length;
}
function popScore(i){const e=$('sc'+i); if(e){e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop');}}
function adj(i,d){snap();S.game.scores[i]=Math.max(0,S.game.scores[i]+d);save();render();popScore(i);}
function setTurn(i){snap();S.game.turn=i;save();render();}

/* ---------- sound (효과음) ---------- */
let AC=null;
function tone(seq){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); let t=AC.currentTime;
  for(const[f,d,type]of seq){const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.value=f;
    g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d);t+=d*.9;} }catch(e){} }
const SND={
  open:()=>tone([[520,.07],[780,.1]]),
  coin:()=>tone([[988,.08],[1319,.35]]),
  steal:()=>tone([[300,.06],[600,.06],[900,.06],[1200,.2]]),
  star:()=>tone([[784,.1],[988,.1],[1175,.1],[1568,.3]]),
  bad:()=>tone([[400,.15,'sawtooth'],[300,.15,'sawtooth'],[200,.4,'sawtooth']]),
  wrong:()=>tone([[220,.25,'triangle'],[180,.3,'triangle']]),
};

/* ---------- play flow ---------- */
let cur=null; // {i}
function showPlay(html){ $('play').innerHTML=html; $('playOv').classList.add('show'); }
function closePlay(){ $('playOv').classList.remove('show'); cur=null; }
function nextTurn(){ const g=S.game; g.turn=(g.turn+1)%S.settings.teams.length; save(); closePlay(); render(); checkEnd(); }

function openQ(i,el){
  if(S.game.used[i])return;
  el.classList.add('bump'); SND.open();
  cur={i}; const q=S.game.qs[i];
  setTimeout(()=>showPlay(`
    <div class="qnum">${i+1}번 · ${esc(S.settings.teams[S.game.turn])}</div>
    <div class="qtype">${esc(q.type)}</div>
    <div class="qtext jp">${fmt(q.q)}</div>
    <div class="answer jp" id="ans">${fmt(q.a)}</div>
    <div class="row" id="qbtns">
      <button class="btn blue" onclick="reveal()">👀 정답 보기</button>
      <button class="btn" onclick="closePlay();render()">취소 (블록 닫기)</button>
    </div>`),180);
}
function reveal(){
  $('ans').classList.add('show');
  $('qbtns').innerHTML=`<button class="btn ok" onclick="judge(true)">⭕ 맞혔어요!</button>
    <button class="btn no" onclick="judge(false)">❌ 틀렸어요</button>`;
}
function judge(ok){
  snap();
  const g=S.game,i=cur.i; g.used[i]=true; save();
  if(!ok){
    SND.wrong();
    showPlay(`<div class="rw-icon">😢</div><div class="rw-title">아쉬워요!</div>
      <div class="rw-desc">이번에는 아이템을 받지 못해요.<br><small>(이 블록 속 아이템: ${ITEMS[g.deck[i]].icon} ${ITEMS[g.deck[i]].title})</small></div>
      <div class="row"><button class="btn primary" onclick="nextTurn()">다음 모둠 →</button></div>`);
    return;
  }
  showReward(g.deck[i]);
}

function showReward(key, fromMystery){
  const it=ITEMS[key], g=S.game, me=g.turn, teams=S.settings.teams;
  if(it.kind==='mystery'){
    const picks=[weighted(MYSTERY_POOL),weighted(MYSTERY_POOL),weighted(MYSTERY_POOL)];
    cur.picks=picks; SND.star();
    showPlay(`<div class="rw-title">${it.title}</div><div class="rw-desc">${it.desc}</div>
      <div class="mystery">${picks.map((p,k)=>`<button class="tile mbox" id="mb${k}" onclick="pickMystery(${k})">?</button>`).join('')}</div>`);
    return;
  }
  let body='', foot=`<div class="row"><button class="btn primary" onclick="nextTurn()">다음 모둠 →</button></div>`;
  if(it.kind==='coin'){ g.scores[me]+=it.pts; SND.coin(); body=`<div class="rw-desc">${esc(teams[me])} ${it.pts}점 획득!</div>`; }
  else if(it.kind==='zero'){ g.scores[me]=0; SND.bad(); body=`<div class="rw-desc">${it.desc}</div>`; }
  else if(it.kind==='shield'){ g.shield[me]=true; SND.star(); body=`<div class="rw-desc">${esc(teams[me])}: ${it.desc}</div>`; }
  else if(it.kind==='steal'){
    SND.steal();
    const others=teams.map((t,k)=>k).filter(k=>k!==me);
    const avail=others.filter(k=>!g.shield[k]);
    if(!avail.length){ body=`<div class="rw-desc">모든 모둠이 무적이라 뺏을 수 없어요!</div>`; }
    else{
      body=`<div class="rw-desc">${it.desc} — 어느 모둠에서 뺏을까요?</div>
      <div class="targets">${others.map(k=>`<button class="btn ${g.shield[k]?'':'blue'}" ${g.shield[k]?'disabled title="무적"':''} onclick="steal(${k},${it.pts})">${esc(teams[k])} (${g.scores[k]}점)${g.shield[k]?' 🌟':''}</button>`).join('')}</div>`;
      foot='';
    }
  }
  save(); render(); popScore(me);
  showPlay(`<div class="rw-icon">${it.icon}</div><div class="rw-title">${it.title}</div>${body}${foot}`);
}
function pickMystery(k){
  const picks=cur.picks;
  picks.forEach((p,j)=>{const b=$('mb'+j);b.textContent=Array.from(ITEMS[p].icon)[0];b.classList.add('reveal');b.disabled=true;b.style.fontSize='clamp(36px,6vw,70px)'; if(j===k)b.classList.add('pick'); else b.style.opacity=.45;});
  setTimeout(()=>showReward(picks[k],true),1100);
}
function steal(k,pts){
  const g=S.game, me=g.turn, take=Math.min(pts,g.scores[k]);
  g.scores[k]-=take; g.scores[me]+=take; SND.coin(); save(); render(); popScore(me); popScore(k);
  const t=S.settings.teams;
  showPlay(`<div class="rw-icon">💰</div><div class="rw-title">${take}점 뺏기 성공!</div>
    <div class="rw-desc">${esc(t[k])} → ${esc(t[me])}${take<pts?` (가진 점수가 ${take}점뿐이었어요)`:''}</div>
    <div class="row"><button class="btn primary" onclick="nextTurn()">다음 모둠 →</button></div>`);
}

function checkEnd(){
  const g=S.game; if(g.used.some(x=>!x))return;
  const order=S.settings.teams.map((t,i)=>({t,s:g.scores[i]})).sort((a,b)=>b.s-a.s);
  const medal=['🥇','🥈','🥉'];
  let rank=0,prev=null;
  showPlay(`<div class="rw-icon">🏆</div><div class="rw-title">게임 끝!</div>
    ${order.map((o,k)=>{ if(o.s!==prev){rank=k;prev=o.s;} return `<div class="rank">${medal[rank]||(rank+1)+'등'} ${esc(o.t)} — ${o.s}점</div>`;}).join('')}
    <div class="row" style="margin-top:14px"><button class="btn" onclick="closePlay()">닫기</button><button class="btn primary" onclick="closePlay();newGame()">새 게임</button></div>`);
  SND.star();
}

/* =========================================================
   📚 문제 세트 보관함
   — claude.ai에 로그인해 열면 계정에 저장(어느 컴퓨터에서든 불러오기)
   — 그 밖의 경우에는 이 브라우저에만 저장
   ========================================================= */
const SETS_KEY='coinBlockQuiz.sets.v1';
let STORE={kind:'local'};
async function initStore(){
  try{
    if(!window.claude||!window.claude.use) return;
    const [d,u]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!d||!u) return;
    const id=await u.id(); if(!id) return;
    STORE={kind:'db', col:d.doc('data/users/'+id+'/qsets').collection('sets')};
  }catch(e){}
}
const storeReady=initStore();
function localSets(){ try{ return JSON.parse(localStorage.getItem(SETS_KEY))||[]; }catch(e){ return []; } }
function writeLocal(list){ try{ localStorage.setItem(SETS_KEY,JSON.stringify(list)); return true; }catch(e){ return false; } }
async function listSets(){
  await storeReady;
  let list;
  if(STORE.kind==='db'){
    const snap=await Promise.race([STORE.col.get(), new Promise((_,r)=>setTimeout(()=>r({code:'timeout'}),10000))]);
    list=snap.docs.filter(d=>d.exists).map(d=>({id:d.id,...d.data()}));
  } else list=localSets();
  return list.sort((a,b)=>(b.updated||0)-(a.updated||0));
}
async function putSet(set){
  await storeReady;
  if(STORE.kind==='db'){ const {id,...body}=set; await STORE.col.doc(id).set(body); }
  else { const l=localSets().filter(x=>x.id!==set.id); l.push(set); if(!writeLocal(l)) throw new Error('local'); }
}
async function removeSet(id){
  await storeReady;
  if(STORE.kind==='db') await STORE.col.doc(id).delete();
  else writeLocal(localSets().filter(x=>x.id!==id));
}
/* GitHub Pages 등에 올렸을 때: 같은 폴더의 questions.txt 에서 문제 세트를 읽어요.
   형식:  ## 세트 이름  줄 아래에  유형 | 문제 | 정답  을 한 줄씩 */
const REPO_FILE='questions.txt';
let repoSets=null;
async function loadRepoSets(){
  if(repoSets) return repoSets;
  try{
    const r=await fetch(REPO_FILE+'?t='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw 0;
    const txt=await r.text(); if(/<html/i.test(txt)) throw 0;
    const out=[]; let cur=null;
    for(const raw of txt.split(/\r?\n/)){
      const line=raw.trim();
      if(line.startsWith('##')){ cur={id:'repo'+out.length, name:line.replace(/^#+/,'').trim()||('세트 '+(out.length+1)), lines:[]}; out.push(cur); continue; }
      if(!cur){ if(line && !line.startsWith('#')){ cur={id:'repo0',name:'기본 문제',lines:[]}; out.push(cur); } else continue; }
      cur.lines.push(raw);
    }
    repoSets=out.map(x=>({id:x.id,name:x.name,questions:x.lines.join('\n').trim(),repo:true})).filter(x=>parseQuestions(x.questions).length);
  }catch(e){ repoSets=[]; }
  return repoSets;
}
let setsCache=[], delArm=null;
function fmtDate(t){ if(!t) return ''; const d=new Date(t); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
async function openSets(focusSave){

    <div class="field"><label>지금 쓰고 있는 문제(${S.game.qs.length}문제)를 세트로 보관하기</label>
      <div class="saverow"><input id="setName" class="jp" placeholder="세트 이름 (예: 4과 た형)" value="${esc(st.setName||st.subtitle||'')}">
      <button class="btn primary" onclick="saveCurrentSet()">💾 보관</button></div>
      <div class="hint" style="margin-top:6px">같은 이름으로 보관하면 그 세트를 새 내용으로 바꿔 저장해요. 제목·부제·모둠 이름도 함께 보관돼요.</div></div>
    <div id="setList" style="font-size:19px;opacity:.7">불러오는 중…</div>
    <p class="hint" id="storeNote" style="margin-top:12px"></p>`);
  if(focusSave===true) setTimeout(()=>{ const i=$('setName'); if(i){i.focus();i.select();} },50);
  await refreshSets();
}
async function refreshSets(){
  const box=$('setList'); if(!box) return;
  try{ setsCache=await listSets(); }
  catch(e){ box.innerHTML='보관함을 불러오지 못했어요. 잠시 뒤 다시 열어 보세요.'; return; }
  if($('storeNote')) $('storeNote').innerHTML = STORE.kind==='db'
    ? '☁️ <b>내 계정에 보관돼요.</b> 다른 컴퓨터에서도 이 링크를 열고 로그인하면 같은 세트를 쓸 수 있어요. 내 세트는 나만 볼 수 있어요.'
    : '💻 게임 안에서 보관한 세트는 <b>이 브라우저에만</b> 저장돼요. 어느 컴퓨터에서나 쓰려면 저장소의 <b>questions.txt</b>에 <code>## 세트 이름</code> 아래로 문제를 추가하세요.';
  const rs=await loadRepoSets();
  box.style.opacity=1;
  let html='';
  if(rs.length){
    html+=`<h3 style="margin:14px 0 4px;font-weight:normal;color:var(--pink-d)">🐙 저장소 문제 세트 <small style="font-size:14px;color:var(--ink);opacity:.7">(questions.txt · 어느 컴퓨터에서나 같아요)</small></h3>`+
      rs.map(x=>`<div class="setcard ${x.name===S.settings.setName?'cur':''}">
      <div class="nm jp">${esc(x.name)}<span class="meta">${parseQuestions(x.questions).length}문제</span></div>
      <button class="btn primary" onclick="useRepoSet('${x.id}')">▶ 이 문제로 시작</button></div>`).join('');
  }
  html+=`<h3 style="margin:14px 0 4px;font-weight:normal;color:var(--pink-d)">${STORE.kind==='db'?'☁️ 내 계정에 보관한 세트':'💻 이 브라우저에 보관한 세트'}</h3>`;
  if(!setsCache.length){ box.innerHTML=html+'<div style="padding:6px 4px">아직 보관한 세트가 없어요. 위에서 지금 문제를 보관해 보세요!</div>'; return; }
  box.innerHTML=html+setsCache.map(x=>{
    const n=parseQuestions(x.questions||'').length;
    return `<div class="setcard ${x.name===S.settings.setName?'cur':''}">
      <div class="nm jp">${esc(x.name)}<span class="meta">${n}문제 · 모둠 ${(x.teams||[]).length}개 · ${fmtDate(x.updated)} 저장</span></div>
      <button class="btn primary" onclick="useSet('${x.id}')">▶ 이 문제로 시작</button>
      <button class="btn blue" onclick="editSet('${x.id}')">✏️ 고치기</button>
      <button class="btn" id="del_${x.id}" onclick="delSet('${x.id}')">🗑 삭제</button></div>`;
  }).join('');
}
async function saveCurrentSet(){
  const name=$('setName').value.trim(); if(!name){ toast('세트 이름을 써 주세요'); return; }
  const st=S.settings, old=setsCache.find(x=>x.name===name);
  const set={id:old?old.id:'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    name, title:st.title, subtitle:st.subtitle, teams:st.teams, questions:st.questions, shuffle:!!st.shuffle, updated:Date.now()};
  try{ await putSet(set); S.settings.setName=name; save(); toast(old?`'${name}' 세트를 새로 저장했어요`:`'${name}' 세트를 보관했어요`); await refreshSets(); }
  catch(e){ toast(e&&e.code==='quota_exceeded'?'보관함이 가득 찼어요. 안 쓰는 세트를 지워 주세요':'보관하지 못했어요. 다시 시도해 주세요'); }
}
function useRepoSet(id){ const x=(repoSets||[]).find(s=>s.id===id); if(!x) return;
  S.settings={...S.settings, questions:x.questions, setName:x.name, subtitle:x.name};
  closeMisc(); newGame(); toast(`'${x.name}' 세트로 새 게임 시작!`); }
function applySet(x){
  S.settings={title:x.title||DEFAULT_SETTINGS.title, subtitle:x.subtitle||'', teams:(x.teams&&x.teams.length?x.teams:DEFAULT_SETTINGS.teams).slice(),
    questions:x.questions||'', shuffle:!!x.shuffle, setName:x.name};
}
function useSet(id){ const x=setsCache.find(s=>s.id===id); if(!x) return; applySet(x); closeMisc(); newGame(); toast(`'${x.name}' 세트로 새 게임 시작!`); }
function editSet(id){ const x=setsCache.find(s=>s.id===id); if(!x) return; applySet(x); newGame(); openSettings(); toast(`'${x.name}' 세트를 불러왔어요. 고친 뒤 [문제 세트로 보관하기]를 누르세요`); }
async function delSet(id){
  const b=$('del_'+id);
  if(delArm!==id){ delArm=id; if(b){ b.textContent='정말 지울까요?'; b.style.background='var(--pink)'; } setTimeout(()=>{ if(delArm===id){ delArm=null; if($('del_'+id)){ $('del_'+id).textContent='🗑 삭제'; $('del_'+id).style.background=''; } } },3000); return; }
  delArm=null;
  try{ await removeSet(id); toast('세트를 지웠어요'); await refreshSets(); }catch(e){ toast('지우지 못했어요. 다시 시도해 주세요'); }
}

document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if($('miscOv').classList.contains('show'))closeMisc(); } });
$('miscOv').addEventListener('click',e=>{ if(e.target.id==='miscOv')closeMisc(); });

/* start */
const firstVisit=!load();
if(!S.game||!S.game.qs||S.game.scores.length!==S.settings.teams.length) newGame(); else render();
if(firstVisit) loadRepoSets().then(rs=>{ if(rs.length && !history.length && S.game.used.every(x=>!x)){ const x=rs[0]; S.settings={...S.settings,questions:x.questions,setName:x.name,subtitle:x.name}; newGame(); } });
</script>
</body>
</html>
