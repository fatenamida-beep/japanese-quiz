<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>몽글몽글 블록 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#6b4a3a; --ink2:#8a6a58; --cream:#fffaf2; --pink:#ff9fbf; --pink-d:#f0789f;
    --mint:#9fe3c8; --butter:#ffe28a; --lav:#cdb8ff; --peach:#ffc49f; --sky:#a9dcff;
    --blue:#7cb8f0; --green:#7fd1a3;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:'Jua','M PLUS Rounded 1c',system-ui,sans-serif;color:var(--ink);min-height:100vh;overflow-x:hidden;
    background:
      radial-gradient(circle at 12px 12px,rgba(255,255,255,.55) 3px,transparent 4px) 0 0/34px 34px,
      linear-gradient(180deg,#ffd9e8 0%,#fbe6ff 45%,#dff1ff 100%);
  }
  .jp{font-family:'M PLUS Rounded 1c','Jua',sans-serif;font-weight:800}
  /* decoration */
  .cloud{position:fixed;background:#fff;border-radius:60px;opacity:.95;z-index:0}
  .cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
  .c1{width:150px;height:44px;top:80px;left:3%}.c1::before{width:66px;height:66px;top:-32px;left:20px}.c1::after{width:52px;height:52px;top:-22px;left:74px}
  .c2{width:190px;height:52px;top:150px;right:5%}.c2::before{width:80px;height:80px;top:-42px;left:28px}.c2::after{width:62px;height:62px;top:-28px;left:100px}
  .hills{position:fixed;left:0;right:0;bottom:0;height:70px;z-index:0;
    background:radial-gradient(ellipse 260px 80px at 15% 100%,#bdf0d6 98%,transparent 100%),
               radial-gradient(ellipse 340px 90px at 70% 100%,#a8e8c8 98%,transparent 100%),
               radial-gradient(ellipse 220px 70px at 100% 100%,#bdf0d6 98%,transparent 100%)}
  .flower{position:fixed;bottom:16px;font-size:22px;z-index:0}

  .app{position:relative;z-index:1;display:grid;grid-template-columns:1fr 290px;gap:18px;padding:14px 20px 70px;max-width:1500px;margin:0 auto}
  header{grid-column:1/-1;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .logo{width:64px;height:64px;animation:bob 2.4s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-5px) rotate(-3deg)}}
  h1{margin:0;font-size:clamp(26px,3.4vw,44px);color:var(--pink-d);letter-spacing:1px;
     text-shadow:3px 0 0 #fff,-3px 0 0 #fff,0 3px 0 #fff,0 -3px 0 #fff,2px 2px 0 #fff,-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff,0 6px 0 rgba(240,120,159,.35)}
  .subtitle{background:#fff;border:3px solid var(--pink);border-radius:999px;padding:4px 14px;font-size:17px}
  .tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  button{font-family:inherit;cursor:pointer;color:inherit}
  .btn{border:3px solid var(--ink);background:#fff;border-radius:999px;padding:8px 16px;font-size:17px;
       box-shadow:0 4px 0 var(--ink);transition:transform .08s}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
  .btn.primary{background:var(--pink)}
  .btn.ok{background:var(--green)}
  .btn.no{background:#d9d2e6}
  .btn.blue{background:var(--sky)}
  .btn:disabled{opacity:.4;cursor:not-allowed}

  /* board */
  .board{display:grid;gap:14px;align-content:start;grid-template-columns:repeat(var(--cols,6),1fr);
         width:100%;max-width:calc((100vh - 130px) / var(--rows,5) * var(--cols,6));margin:0 auto}
  .tile{aspect-ratio:1/1;border:3px solid var(--ink);border-radius:26px;position:relative;background:var(--c,#ffe28a);
        box-shadow:inset 0 -8px 0 rgba(0,0,0,.08),0 5px 0 var(--ink);
        display:flex;align-items:center;justify-content:center;font-size:clamp(26px,3.4vw,48px);color:var(--ink);
        transition:transform .15s}
  .tile::before{content:"";position:absolute;top:10%;left:14%;width:26%;height:14%;background:rgba(255,255,255,.75);border-radius:999px;transform:rotate(-18deg)}
  .tile .cheek{position:absolute;bottom:20%;width:14%;height:8%;background:rgba(255,120,150,.35);border-radius:50%}
  .tile .cheek.l{left:14%}.tile .cheek.r{right:14%}
  .tile:hover:not(.used){transform:translateY(-6px) rotate(-2deg)}
  .tile.used{background:#efe6dc;cursor:default;box-shadow:0 2px 0 var(--ink);opacity:.85}
  .tile.used::before,.tile.used .cheek{display:none}
  .tile.used svg{width:46%;height:46%;opacity:.6}
  .tile.bump{animation:bump .4s}
  @keyframes bump{40%{transform:translateY(-16px) scale(1.06)}100%{transform:none}}

  /* teams */
  .side{display:flex;flex-direction:column;gap:8px}
  .turnbox{background:#fff;border:3px solid var(--ink);border-radius:22px;padding:6px 12px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 0 var(--ink)}
  .turnbox svg{width:62px;height:62px;flex:none}
  .turnbox .tt{font-size:16px;line-height:1.2}
  .turnbox b{display:block;font-size:27px;color:var(--pink-d)}
  .team{background:var(--cream);border:3px solid var(--ink);border-radius:20px;padding:5px 12px;
        display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 8px;box-shadow:0 4px 0 var(--ink)}
  .team.now{background:#fff0f6;outline:4px dashed var(--pink-d);outline-offset:3px}
  .team .nm{font-size:19px;display:flex;align-items:center;gap:6px}
  .team .nm svg{width:26px;height:26px}
  .team .sc{font-size:30px;color:var(--pink-d);text-align:right;min-width:70px}
  .team .adj{grid-column:1/-1;display:flex;gap:6px}
  .team .adj button{border:2px solid var(--ink2);background:#fff;border-radius:999px;font-size:13px;padding:1px 9px}
  .sc.pop{animation:pop .5s}
  @keyframes pop{30%{transform:scale(1.45)}}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(120,80,110,.45);z-index:20;display:none;align-items:center;justify-content:center;padding:20px}
  .overlay.show{display:flex}
  .modal{background:var(--cream);border:4px solid var(--ink);border-radius:32px;box-shadow:0 10px 0 var(--ink);
         width:min(980px,100%);max-height:92vh;overflow:auto;padding:24px 30px;text-align:center;position:relative;animation:zoom .3s cubic-bezier(.3,1.6,.5,1)}
  @keyframes zoom{from{transform:scale(.7);opacity:0}}
  .qtype{display:inline-block;background:var(--pink);border:3px solid var(--ink);border-radius:999px;padding:4px 20px;font-size:24px;margin-bottom:6px}
  .qnum{position:absolute;top:16px;left:24px;font-size:19px;opacity:.6}
  .peek{position:absolute;width:110px;height:110px;right:22px;top:-6px}
  .qtext{font-size:clamp(34px,5.4vw,70px);line-height:1.35;margin:14px 0 16px;word-break:keep-all}
  .answer{font-size:clamp(30px,4.6vw,58px);color:var(--pink-d);background:#fff;border:4px dashed var(--pink);border-radius:24px;
          padding:12px 18px;margin:8px auto 18px;display:none;line-height:1.35;word-break:keep-all}
  .answer.show{display:block;animation:zoom .3s cubic-bezier(.3,1.6,.5,1)}
  .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .row .btn{font-size:22px;padding:10px 24px}
  .rw-art{width:clamp(170px,24vw,260px);height:clamp(170px,24vw,260px);margin:0 auto;animation:hop .7s cubic-bezier(.3,1.6,.5,1)}
  .rw-art svg{width:100%;height:100%}
  @keyframes hop{0%{transform:translateY(60px) scale(.4);opacity:0}60%{transform:translateY(-12px) scale(1.05)}}
  .wiggle{animation:wig 1.2s ease-in-out infinite}
  @keyframes wig{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
  .coins{display:flex;justify-content:center;gap:4px;margin:-4px 0 4px}
  .coins svg{width:44px;height:44px;animation:hop .6s backwards}
  .rw-title{font-size:clamp(30px,4.6vw,54px);margin:4px 0;color:var(--pink-d)}
  .rw-desc{font-size:22px;margin-bottom:16px}
  .mystery{display:flex;gap:22px;justify-content:center;margin:14px 0}
  .mbox{width:clamp(110px,17vw,180px);aspect-ratio:1/1;border:none;background:none;padding:0;transition:transform .15s}
  .mbox:hover:not(:disabled){transform:translateY(-8px) rotate(-4deg)}
  .mbox svg{width:100%;height:100%}
  .mbox.pick{transform:scale(1.08)}
  .mbox.dim{opacity:.4}
  .targets{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0 16px}
  .targets .btn{font-size:22px}
  .sparkle{position:fixed;pointer-events:none;z-index:40;font-size:26px;animation:fly 1s ease-out forwards}
  @keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.3) rotate(180deg);opacity:0}}

  /* settings */
  .modal.left{text-align:left}
  .modal h2{margin:0 0 10px;font-size:30px;color:var(--pink-d)}
  .field{margin:12px 0}
  .field label{display:block;font-size:19px;margin-bottom:6px}
  .field input,.field textarea,.field select{width:100%;font-family:'M PLUS Rounded 1c',sans-serif;font-size:16px;border:3px solid var(--ink);border-radius:14px;padding:8px 10px;background:#fff;color:var(--ink)}
  .field textarea{min-height:300px;line-height:1.6;font-weight:500}
  .hint{font-size:15px;line-height:1.6;background:#fff0f6;border-radius:14px;padding:8px 12px;font-family:'M PLUS Rounded 1c',sans-serif}
  .hint code{background:#fff;border:1px solid #f3c;border-radius:6px;padding:0 5px}
  .teamnames{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
  .itemlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin:10px 0}
  .itemlist div{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:6px 10px;font-size:19px;display:flex;gap:8px;align-items:center}
  .itemlist svg{width:58px;height:58px;flex:none}
  .rank{font-size:30px;margin:6px 0}
  .setcard{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:10px 14px;margin:8px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .setcard .nm{font-size:22px;flex:1;min-width:180px}
  .setcard .meta{font-size:14px;opacity:.65;display:block;font-family:'M PLUS Rounded 1c',sans-serif}
  .setcard .btn{font-size:15px;padding:5px 12px}
  .setcard.cur{background:#fff0f6;border-color:var(--pink-d)}
  .saverow{display:flex;gap:8px;flex-wrap:wrap}.saverow input{flex:1;min-width:200px}
  .x{position:absolute;top:10px;right:16px;border:none;background:none;font-size:28px}
  .toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:999px;z-index:50;font-size:18px;display:none}

  @media (max-width:900px){
    .app{grid-template-columns:1fr}
    .side{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
    .turnbox{grid-column:1/-1}
  }
</style>
</head>
<body>
<div class="cloud c1"></div><div class="cloud c2"></div>
<div class="hills"></div>
<div class="flower" style="left:6%">🌷</div><div class="flower" style="left:40%">🌼</div><div class="flower" style="right:8%">🌸</div>

<div class="app">
  <header>
    <div class="logo" id="logo"></div>
    <h1 id="title">몽글몽글 블록 퀴즈</h1>
    <div class="subtitle jp" id="subtitle"></div>
    <div class="tools">
      <button class="btn" onclick="openHelp()">❔ 규칙</button>
      <button class="btn" id="undoBtn" onclick="undo()">↩ 되돌리기</button>
      <button class="btn" onclick="openSets()" style="background:var(--butter)">📚 문제 세트</button>
      <button class="btn blue" onclick="openSettings()">✏️ 문제·모둠 설정</button>
      <button class="btn primary" onclick="confirmNewGame()">🔄 새 게임</button>
    </div>
  </header>
  <main class="board" id="board"></main>
  <aside class="side" id="side"></aside>
</div>

<div class="overlay" id="playOv"><div class="modal" id="play"></div></div>
<div class="overlay" id="miscOv"><div class="modal left" id="misc"></div></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   ✏️ 기본 문제 목록 — 여기만 고치면 문제가 바뀝니다.
   (게임 화면의 [문제·모둠 설정]에서 바로 고쳐도 됩니다.)
   한 줄에 문제 하나:   유형 | 문제 | 정답
   · 줄바꿈이 필요하면 "/" 를 넣으세요.
   · 유형을 빼고  문제 | 정답  만 써도 됩니다.
   · # 으로 시작하는 줄은 무시됩니다.
   ========================================================= */
const DEFAULT_QUESTIONS = `
た형으로 바꾸면? | 行く | 行った
일본어로 말하면? | 일본에 간 적이 있습니까? | 日本へ行ったことが/ありますか。
た형으로 바꾸면? | 泳ぐ | 泳いだ
빈칸에 알맞은 말은? | 飛行機に（乗る）/ことがありますか。 | 乗った
대답해 보세요! | 芸能人に会ったことがありますか。/→ 네, 한 번 있습니다. | はい、一度あります。
조언해 주세요! | 「調子が悪いです。」/→ 병원에 가는 편이 좋아요. | 病院へ/行った方がいいです。
한자 읽기! | 飛行機 | ひこうき
일본어로 말하면? | 푹 쉬는 편이 좋습니다. | ゆっくり/休んだ方がいいです。
た형으로 바꾸면? | 来る | 来た（きた）
한국어로 해석하면? | 日本語の勉強を/始めたばかりです。 | 일본어 공부를/막 시작했습니다.
빈칸에 알맞은 말은? | 手紙より電話を（する）/方がいいです。 | した
쉬어가기 퀴즈! | 바다를 주제로 한/도쿄 디즈니리조트의 테마파크는? | 도쿄 디즈니씨
일본어로 말하면? | 지금 막 일어났습니다. | 今/起きたばかりです。
한자 읽기! | 美術館 | びじゅつかん
틀린 곳을 고치면? | 日本へ行いたことが/あります。 | 行いた → 行った
대답해 보세요! | アメリカへ行ったことがありますか。/→ 아니요, 없습니다. | いいえ、ありません。
た형으로 바꾸면? | 飲む | 飲んだ
한국어로 해석하면? | タクシーより/バスに乗った方がいいです。 | 택시보다 버스를/타는 편이 좋습니다.
일본어로 말하면? | 이 소설을 읽은 적이 있습니다. | この小説を/読んだことがあります。
빈칸에 알맞은 말은? | 空港に（着く）/ばかりです。 | 着いた
조언해 주세요! | 「調子が悪いです。」/→ 약을 먹는 편이 좋아요. | 薬を/飲んだ方がいいです。
쉬어가기 퀴즈! | 유니버설 스튜디오 재팬이/있는 도시는? | 오사카（大阪）
한자 읽기! | 表現 | ひょうげん
た형으로 바꾸면? | 帰る | 帰った
た형으로 바꾸면? | 書く | 書いた
た형으로 바꾸면? | 待つ | 待った
た형으로 바꾸면? | 話す | 話した
た형으로 바꾸면? | 遊ぶ | 遊んだ
한자 읽기! | 会話 | かいわ
일본어로 말하면? | 2년 전에 간 적이 있습니다. | 2年前に/行ったことがあります。
`;

const DEFAULT_SETTINGS = {
  title: '몽글몽글 블록 퀴즈',
  subtitle: '4과  日本へ行ったことがありますか。',
  teams: ['1모둠','2모둠','3모둠','4모둠','5모둠','6모둠'],
  questions: DEFAULT_QUESTIONS.trim(),
  shuffle: false
};

/* =========================================================
   🐹 캐릭터 그림 (직접 그린 SVG)
   ========================================================= */
const L='stroke="#6b4a3a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"';
const EYES=(x1,x2,y)=>`<ellipse cx="${x1}" cy="${y}" rx="7" ry="9" fill="#4a3228"/><ellipse cx="${x2}" cy="${y}" rx="7" ry="9" fill="#4a3228"/>
  <circle cx="${x1+2.5}" cy="${y-3.5}" r="3" fill="#fff"/><circle cx="${x2+2.5}" cy="${y-3.5}" r="3" fill="#fff"/>`;
const HAPPY=(x1,x2,y)=>`<path d="M${x1-8} ${y+2} q8 -11 16 0 M${x2-8} ${y+2} q8 -11 16 0" fill="none" ${L}/>`;
const BLUSH=(x1,x2,y)=>`<ellipse cx="${x1}" cy="${y}" rx="11" ry="7" fill="#ff9fb8" opacity=".75"/><ellipse cx="${x2}" cy="${y}" rx="11" ry="7" fill="#ff9fb8" opacity=".75"/>`;
const MOUTH_W=(x,y)=>`<path d="M${x-9} ${y} q4.5 6 9 0 q4.5 6 9 0" fill="none" ${L} stroke-width="4"/>`;
const COIN=(x,y,r)=>`<g><circle cx="${x}" cy="${y}" r="${r}" fill="#ffd34d" ${L} stroke-width="4"/><circle cx="${x}" cy="${y}" r="${r*.68}" fill="none" stroke="#e8a92a" stroke-width="3"/>
  <path d="M${x} ${y-r*.42} l${r*.13} ${r*.27} ${r*.3} ${r*.04} -${r*.22} ${r*.2} ${r*.06} ${r*.3} -${r*.27} -${r*.15} -${r*.27} ${r*.15} ${r*.06} -${r*.3} -${r*.22} -${r*.2} ${r*.3} -${r*.04}z" fill="#fff6c9"/></g>`;
const SPARK=(x,y,s,c)=>`<path d="M${x} ${y-s} Q${x} ${y} ${x+s} ${y} Q${x} ${y} ${x} ${y+s} Q${x} ${y} ${x-s} ${y} Q${x} ${y} ${x} ${y-s}z" fill="${c||'#fff2a8'}"/>`;

const ART = {
  /* 볼 빵빵 햄스터 — 코인 */
  hamster: (happy=true)=>`<svg viewBox="0 0 200 200">
    ${SPARK(30,40,12)}${SPARK(172,58,9,'#ffd1e3')}${SPARK(160,22,7)}
    <ellipse cx="100" cy="186" rx="58" ry="8" fill="#000" opacity=".08"/>
    <circle cx="58" cy="58" r="17" fill="#f4a95f" ${L}/><circle cx="58" cy="58" r="8" fill="#ffb4c6"/>
    <circle cx="142" cy="58" r="17" fill="#f4a95f" ${L}/><circle cx="142" cy="58" r="8" fill="#ffb4c6"/>
    <path d="M40 120 C34 70 70 48 100 48 C130 48 166 70 160 120 C158 160 132 182 100 182 C68 182 42 160 40 120z" fill="#f4a95f" ${L}/>
    <path d="M62 132 C60 104 80 92 100 92 C120 92 140 104 138 132 C136 160 120 176 100 176 C80 176 64 160 62 132z" fill="#fff4e3"/>
    ${happy?HAPPY(78,122,96):EYES(78,122,96)}
    ${BLUSH(64,136,114)}
    <ellipse cx="100" cy="106" rx="5" ry="3.5" fill="#e97a8f"/>
    ${MOUTH_W(100,112)}
    ${COIN(100,148,22)}
    <ellipse cx="78" cy="146" rx="10" ry="8" fill="#f4a95f" ${L} stroke-width="4"/><ellipse cx="122" cy="146" rx="10" ry="8" fill="#f4a95f" ${L} stroke-width="4"/>
  </svg>`,

  /* 살금살금 아기 여우 — 점수 뺏기 */
  fox: (bag='10')=>`<svg viewBox="0 0 200 200">
    ${SPARK(28,36,10)}${SPARK(176,40,8,'#ffd1e3')}
    <ellipse cx="100" cy="188" rx="56" ry="8" fill="#000" opacity=".08"/>
    <path d="M150 168 C190 160 196 110 168 96 C176 124 160 140 140 148z" fill="#ff9a52" ${L}/>
    <path d="M168 96 C182 110 184 128 176 142 C170 130 168 112 168 96z" fill="#fff4e3"/>
    <path d="M52 40 L74 82 L42 92z" fill="#ff9a52" ${L}/><path d="M53 54 L66 80 L48 86z" fill="#5a3a30"/>
    <path d="M148 40 L126 82 L158 92z" fill="#ff9a52" ${L}/><path d="M147 54 L134 80 L152 86z" fill="#5a3a30"/>
    <path d="M36 112 C36 76 66 66 100 66 C134 66 164 76 164 112 C164 150 136 178 100 178 C64 178 36 150 36 112z" fill="#ff9a52" ${L}/>

const DECK_RATIO = {coin1:3,coin2:4,coin3:5,coin4:3,coin5:2,fire:4,bolt:1,star:1,bomb:1,ghost:1,storm:1,mystery:4};
/* 선물 상자 안에 들어갈 수 있는 것들 (숫자 = 나올 확률 가중치) */
const MYSTERY_POOL = {coin1:2,coin2:2,coin3:2,coin5:1,fire:2,bolt:1,bomb:1,ghost:1,storm:1};
const TILE_COLORS = ['#ffd3e2','#c8f0de','#fff0a8','#e2d6ff','#ffdcc4','#cfe9ff'];

/* ---------- 저장 (브라우저에만 저장됨) ---------- */
const KEY='coinBlockQuiz.v1';
function load(){ try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s&&s.settings) return s; }catch(e){} return null; }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
let S = load() || {settings:structuredClone(DEFAULT_SETTINGS), game:null};
if(S.settings.title==='코인 블록 퀴즈') S.settings.title=DEFAULT_SETTINGS.title;
let history=[];

/* ---------- utils ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>esc(s).split('/').map(x=>x.trim()).join('<br>');
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function weighted(pool){const e=Object.entries(pool);let t=e.reduce((s,[,w])=>s+w,0),r=Math.random()*t;for(const[k,w]of e){if((r-=w)<0)return k;}return e[0][0];}
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',1800);}
function sparkles(n=14){const ch=['✨','💖','⭐','🌸','💛'];for(let i=0;i<n;i++){const s=document.createElement('div');s.className='sparkle';s.textContent=ch[i%ch.length];
  s.style.left=(innerWidth/2)+'px';s.style.top=(innerHeight/2-60)+'px';const a=Math.random()*Math.PI*2,d=160+Math.random()*220;
  s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),1100);}}

function parseQuestions(text){
  return text.split('\n').map(l=>l.trim()).filter(l=>l&&!l.startsWith('#')).map(l=>{
    const p=l.split('|').map(x=>x.trim());
    if(p.length>=3) return {type:p[0],q:p[1],a:p.slice(2).join(' | ')};
    if(p.length===2) return {type:'문제',q:p[0],a:p[1]};
    return {type:'문제',q:p[0],a:''};
  });
}
function buildDeck(n){
  const total=Object.values(DECK_RATIO).reduce((a,b)=>a+b,0); let deck=[];
  for(const[k,w]of Object.entries(DECK_RATIO)){ const c=Math.round(w*n/total); for(let i=0;i<c;i++)deck.push(k); }
  const coins=['coin1','coin2','coin3','coin4','coin5'];
  while(deck.length<n) deck.push(coins[Math.floor(Math.random()*coins.length)]);
  shuffle(deck); return deck.slice(0,n);
}
function newGame(){
  const qs=parseQuestions(S.settings.questions); if(S.settings.shuffle) shuffle(qs);
  const n=qs.length, t=S.settings.teams.length;
  S.game={qs, deck:buildDeck(n), used:Array(n).fill(false), scores:Array(t).fill(0), shield:Array(t).fill(false), turn:0};
  history=[]; save(); render();
}
function confirmNewGame(){
  showMisc(`<h2>🔄 새 게임을 시작할까요?</h2><p style="font-size:20px">점수와 열린 블록이 모두 초기화되고, 아이템 위치도 새로 섞여요.</p>
  <div class="row"><button class="btn primary" onclick="closeMisc();newGame();toast('새 게임 시작!')">새 게임 시작</button><button class="btn" onclick="closeMisc()">취소</button></div>`);
}
function snap(){ history.push(JSON.stringify(S.game)); if(history.length>50)history.shift(); }
function undo(){ if(!history.length){toast('되돌릴 기록이 없어요');return;} S.game=JSON.parse(history.pop()); save(); render(); toast('한 단계 되돌렸어요'); }

/* ---------- render ---------- */
function render(){
  const g=S.game, st=S.settings;
  $('logo').innerHTML=ART.hamster();
  $('title').textContent=st.title||DEFAULT_SETTINGS.title; document.title=st.title||DEFAULT_SETTINGS.title;
  $('subtitle').textContent=st.subtitle||''; $('subtitle').style.display=st.subtitle?'':'none';
  const n=g.qs.length, cols=n<=12?4:n<=20?5:n<=30?6:n<=42?7:8;
  const b=$('board'); b.style.setProperty('--cols',cols); b.style.setProperty('--rows',Math.ceil(n/cols));
  b.innerHTML=g.qs.map((q,i)=>g.used[i]
    ? `<button class="tile used" disabled aria-label="${i+1}번 (열림)">${ART.paw()}</button>`
    : `<button class="tile" style="--c:${TILE_COLORS[i%TILE_COLORS.length]}" onclick="openQ(${i},this)" aria-label="${i+1}번">${i+1}<span class="cheek l"></span><span class="cheek r"></span></button>`).join('');
  $('side').innerHTML=`<div class="turnbox">${TEAM_FACES[g.turn%TEAM_FACES.length]()}<div class="tt">지금 차례<b>${esc(st.teams[g.turn]||'')}</b><span style="font-size:14px;opacity:.7">남은 블록 ${g.used.filter(x=>!x).length}개</span></div></div>`+
    st.teams.map((t,i)=>`<div class="team ${i===g.turn?'now':''}">
      <div class="nm">${esc(t)} ${g.shield[i]?ART.bunny():''}</div>
      <div class="sc" id="sc${i}">${g.scores[i]}</div>
      <div class="adj"><button onclick="adj(${i},10)">+10</button><button onclick="adj(${i},-10)">−10</button><button onclick="setTurn(${i})">이 모둠 차례로</button></div>
    </div>`).join('');
  $('undoBtn').disabled=!history.length;
}
function popScore(i){const e=$('sc'+i); if(e){e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop');}}
function adj(i,d){snap();S.game.scores[i]=Math.max(0,S.game.scores[i]+d);save();render();popScore(i);}
function setTurn(i){snap();S.game.turn=i;save();render();}

/* ---------- 효과음 ---------- */
let AC=null;
function tone(seq){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); let t=AC.currentTime;
  for(const[f,d,type]of seq){const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;
    g.gain.setValueAtTime(.14,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d);t+=d*.85;} }catch(e){} }
const SND={
  open:()=>tone([[660,.08],[990,.12]]),
  coin:()=>tone([[1047,.08],[1319,.08],[1568,.3]]),
  steal:()=>tone([[523,.07],[659,.07],[784,.07],[1047,.2]]),
  star:()=>tone([[784,.1],[988,.1],[1175,.1],[1568,.35]]),
  bad:()=>tone([[440,.18,'triangle'],[370,.18,'triangle'],[294,.45,'triangle']]),
  wrong:()=>tone([[392,.2,'triangle'],[330,.35,'triangle']]),
};

/* ---------- 게임 진행 ---------- */
let cur=null;

function closePlay(){ $('playOv').classList.remove('show'); cur=null; }
function nextTurn(){ const g=S.game; g.turn=(g.turn+1)%S.settings.teams.length; save(); closePlay(); render(); checkEnd(); }

function openQ(i,el){
  if(S.game.used[i])return;
  el.classList.add('bump'); SND.open(); cur={i}; const q=S.game.qs[i];
  setTimeout(()=>showPlay(`
    <div class="qnum">${i+1}번 · ${esc(S.settings.teams[S.game.turn])}</div>
    <div class="peek wiggle">${ART.chick()}</div>
    <div class="qtype">${esc(q.type)}</div>
    <div class="qtext jp">${fmt(q.q)}</div>
    <div class="answer jp" id="ans">${fmt(q.a)}</div>
    <div class="row" id="qbtns">
      <button class="btn blue" onclick="reveal()">👀 정답 보기</button>
      <button class="btn" onclick="closePlay();render()">취소 (블록 닫기)</button>
    </div>`),200);
}
function reveal(){
  $('ans').classList.add('show');
  $('qbtns').innerHTML=`<button class="btn ok" onclick="judge(true)">⭕ 맞혔어요!</button><button class="btn no" onclick="judge(false)">❌ 틀렸어요</button>`;
}
function judge(ok){
  snap(); const g=S.game,i=cur.i; g.used[i]=true; save();
  if(!ok){
    SND.wrong(); const it=ITEMS[g.deck[i]];
    showPlay(`<div class="rw-art wiggle">${ART.sad()}</div><div class="rw-title">아쉬워요…</div>
      <div class="rw-desc">이번에는 아이템을 받지 못해요.<br><small style="opacity:.7">(이 블록 속 아이템: ${it.title})</small></div>
      <div class="row"><button class="btn primary" onclick="nextTurn()">다음 모둠 →</button></div>`);
    return;
  }
  showReward(g.deck[i]);
}
function showReward(key){
  const it=ITEMS[key], g=S.game, me=g.turn, teams=S.settings.teams;
  if(it.kind==='mystery'){
    const picks=[weighted(MYSTERY_POOL),weighted(MYSTERY_POOL),weighted(MYSTERY_POOL)]; cur.picks=picks; SND.star();
    const gc=['#ffb3cd','#a8e6cf','#cdb8ff'];
    showPlay(`<div class="rw-art" style="width:150px;height:150px">${it.art()}</div><div class="rw-title">${it.title}</div><div class="rw-desc">${it.desc}</div>
      <div class="mystery">${picks.map((p,k)=>`<button class="mbox wiggle" style="animation-delay:${k*.2}s" id="mb${k}" onclick="pickMystery(${k})">${ART.gift(gc[k])}</button>`).join('')}</div>`);
    return;
  }
  let body='', foot=`<div class="row"><button class="btn primary" onclick="nextTurn()">다음 모둠 →</button></div>`, extra='';
  if(it.kind==='coin'){ g.scores[me]+=it.pts; SND.coin(); sparkles();
    extra=`<div class="coins">${Array.from({length:it.n},(_,k)=>`<span style="animation-delay:${.3+k*.12}s;display:inline-block">${ART.coin()}</span>`).join('')}</div>`;
    body=`<div class="rw-desc">${esc(teams[me])} ${it.pts}점 획득! ${it.desc}</div>`; }
  else if(it.kind==='zero'){ g.scores[me]=0; SND.bad(); body=`<div class="rw-desc">${it.desc}</div>`; }
  else if(it.kind==='shield'){ g.shield[me]=true; SND.star(); sparkles(20); body=`<div class="rw-desc">${esc(teams[me])}: ${it.desc}</div>`; }
  else if(it.kind==='steal'){
    SND.steal();
    const others=teams.map((t,k)=>k).filter(k=>k!==me), avail=others.filter(k=>!g.shield[k]);
    if(!avail.length){ body=`<div class="rw-desc">모든 모둠이 무적이라 뺏을 수 없어요!</div>`; }
    else{
      body=`<div class="rw-desc">${it.desc}<br>어느 모둠에서 뺏을까요?</div>
      <div class="targets">${others.map(k=>`<button class="btn ${g.shield[k]?'':'blue'}" ${g.shield[k]?'disabled title="무적"':''} onclick="steal(${k},${it.pts})">${esc(teams[k])} (${g.scores[k]}점)${g.shield[k]?' 🌟':''}</button>`).join('')}</div>`;
      foot='';
    }
  }
  save(); render(); popScore(me);
  showPlay(`<div class="rw-art"><div class="${it.kind==='zero'?'wiggle':''}" style="width:100%;height:100%">${it.art()}</div></div>${extra}<div class="rw-title">${it.title}</div>${body}${foot}`);
}
function pickMystery(k){
  const picks=cur.picks;
  picks.forEach((p,j)=>{const b=$('mb'+j); b.disabled=true; b.classList.remove('wiggle'); b.innerHTML=ITEMS[p].art(); if(j===k)b.classList.add('pick'); else b.classList.add('dim');});
  SND.open(); setTimeout(()=>showReward(picks[k]),1300);
}
function steal(k,pts){
  const g=S.game, me=g.turn, take=Math.min(pts,g.scores[k]);
  g.scores[k]-=take; g.scores[me]+=take; SND.coin(); sparkles(10); save(); render(); popScore(me); popScore(k);
  const t=S.settings.teams;
  showPlay(`<div class="rw-art">${ART.fox(String(take))}</div><div class="rw-title">${take}점 슬쩍 성공!</div>
    <div class="rw-desc">${esc(t[k])} → ${esc(t[me])}${take<pts?` (가진 점수가 ${take}점뿐이었어요)`:''}</div>
    <div class="row"><button class="btn primary" onclick="nextTurn()">다음 모둠 →</button></div>`);
}
function checkEnd(){
  const g=S.game; if(g.used.some(x=>!x))return;
  const order=S.settings.teams.map((t,i)=>({t,s:g.scores[i]})).sort((a,b)=>b.s-a.s);
  const medal=['🥇','🥈','🥉']; let rank=0,prev=null;
  showPlay(`<div class="rw-art">${ART.trophy()}</div><div class="rw-title">게임 끝! 모두 수고했어요</div>
    ${order.map((o,k)=>{ if(o.s!==prev){rank=k;prev=o.s;} return `<div class="rank">${medal[rank]||(rank+1)+'등'} ${esc(o.t)} — ${o.s}점</div>`;}).join('')}
    <div class="row" style="margin-top:14px"><button class="btn" onclick="closePlay()">닫기</button><button class="btn primary" onclick="closePlay();newGame()">새 게임</button></div>`);
  SND.star(); sparkles(30);
}

function drawTeamInputs(){

  const qs=parseQuestions($('sQ').value);

    teams:[...$('sTeams').querySelectorAll('input')].map((x,i)=>x.value.trim()||(i+1)+'모둠'),
    questions:$('sQ').value, shuffle:$('sShuf').checked, setName:S.settings.setName||''};

function copyQ(){ const v=$('sQ').value; navigator.clipboard.writeText(v).then(()=>toast('복사했어요')).catch(()=>{$('sQ').select();toast('Ctrl+C 로 복사하세요');}); }
function resetQ(){ $('sQ').value=DEFAULT_QUESTIONS.trim(); countQ(); }

/* =========================================================
   📚 문제 세트 보관함
   — claude.ai에 로그인해 열면 계정에 저장(어느 컴퓨터에서든 불러오기)
   — 그 밖의 경우에는 이 브라우저에만 저장
   ========================================================= */
const SETS_KEY='coinBlockQuiz.sets.v1';
let STORE={kind:'local'};
async function initStore(){
  try{
    if(!window.claude||!window.claude.use) return;
    const [d,u]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!d||!u) return;
    const id=await u.id(); if(!id) return;
    STORE={kind:'db', col:d.doc('data/users/'+id+'/qsets').collection('sets')};
  }catch(e){}
}
const storeReady=initStore();
function localSets(){ try{ return JSON.parse(localStorage.getItem(SETS_KEY))||[]; }catch(e){ return []; } }
function writeLocal(list){ try{ localStorage.setItem(SETS_KEY,JSON.stringify(list)); return true; }catch(e){ return false; } }
async function listSets(){
  await storeReady;
  let list;
  if(STORE.kind==='db'){
    const snap=await Promise.race([STORE.col.get(), new Promise((_,r)=>setTimeout(()=>r({code:'timeout'}),10000))]);
    list=snap.docs.filter(d=>d.exists).map(d=>({id:d.id,...d.data()}));
  } else list=localSets();
  return list.sort((a,b)=>(b.updated||0)-(a.updated||0));
}
async function putSet(set){
  await storeReady;
  if(STORE.kind==='db'){ const {id,...body}=set; await STORE.col.doc(id).set(body); }
  else { const l=localSets().filter(x=>x.id!==set.id); l.push(set); if(!writeLocal(l)) throw new Error('local'); }
}
async function removeSet(id){
  await storeReady;
  if(STORE.kind==='db') await STORE.col.doc(id).delete();
  else writeLocal(localSets().filter(x=>x.id!==id));
}
/* GitHub Pages 등에 올렸을 때: 같은 폴더의 questions.txt 에서 문제 세트를 읽어요.
   형식:  ## 세트 이름  줄 아래에  유형 | 문제 | 정답  을 한 줄씩 */
const REPO_FILE='questions.txt';
let repoSets=null;
async function loadRepoSets(){
  if(repoSets) return repoSets;
  try{
    const r=await fetch(REPO_FILE+'?t='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw 0;
    const txt=await r.text(); if(/<html/i.test(txt)) throw 0;
    const out=[]; let cur=null;
    for(const raw of txt.split(/\r?\n/)){
      const line=raw.trim();
      if(line.startsWith('##')){ cur={id:'repo'+out.length, name:line.replace(/^#+/,'').trim()||('세트 '+(out.length+1)), lines:[]}; out.push(cur); continue; }
      if(!cur){ if(line && !line.startsWith('#')){ cur={id:'repo0',name:'기본 문제',lines:[]}; out.push(cur); } else continue; }
      cur.lines.push(raw);
    }
    repoSets=out.map(x=>({id:x.id,name:x.name,questions:x.lines.join('\n').trim(),repo:true})).filter(x=>parseQuestions(x.questions).length);
  }catch(e){ repoSets=[]; }
  return repoSets;
}
let setsCache=[], delArm=null;
function fmtDate(t){ if(!t) return ''; const d=new Date(t); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
async function openSets(focusSave){
  const st=S.settings;
  showMisc(`<h2>📚 문제 세트 보관함</h2>
    <div class="field"><label>지금 쓰고 있는 문제(${S.game.qs.length}문제)를 세트로 보관하기</label>
      <div class="saverow"><input id="setName" class="jp" placeholder="세트 이름 (예: 4과 た형)" value="${esc(st.setName||st.subtitle||'')}">
      <button class="btn primary" onclick="saveCurrentSet()">💾 보관</button></div>
      <div class="hint" style="margin-top:6px">같은 이름으로 보관하면 그 세트를 새 내용으로 바꿔 저장해요. 제목·부제·모둠 이름도 함께 보관돼요.</div></div>
    <div id="setList" style="font-size:19px;opacity:.7">불러오는 중…</div>
    <p class="hint" id="storeNote" style="margin-top:12px"></p>`);
  if(focusSave===true) setTimeout(()=>{ const i=$('setName'); if(i){i.focus();i.select();} },50);
  await refreshSets();
}
async function refreshSets(){
  const box=$('setList'); if(!box) return;
  try{ setsCache=await listSets(); }
  catch(e){ box.innerHTML='보관함을 불러오지 못했어요. 잠시 뒤 다시 열어 보세요.'; return; }
  if($('storeNote')) $('storeNote').innerHTML = STORE.kind==='db'
    ? '☁️ <b>내 계정에 보관돼요.</b> 다른 컴퓨터에서도 이 링크를 열고 로그인하면 같은 세트를 쓸 수 있어요. 내 세트는 나만 볼 수 있어요.'
    : '💻 게임 안에서 보관한 세트는 <b>이 브라우저에만</b> 저장돼요. 어느 컴퓨터에서나 쓰려면 저장소의 <b>questions.txt</b>에 <code>## 세트 이름</code> 아래로 문제를 추가하세요.';
  const rs=await loadRepoSets();
  box.style.opacity=1;
  let html='';
  if(rs.length){
    html+=`<h3 style="margin:14px 0 4px;font-weight:normal;color:var(--pink-d)">🐙 저장소 문제 세트 <small style="font-size:14px;color:var(--ink);opacity:.7">(questions.txt · 어느 컴퓨터에서나 같아요)</small></h3>`+
      rs.map(x=>`<div class="setcard ${x.name===S.settings.setName?'cur':''}">
      <div class="nm jp">${esc(x.name)}<span class="meta">${parseQuestions(x.questions).length}문제</span></div>
      <button class="btn primary" onclick="useRepoSet('${x.id}')">▶ 이 문제로 시작</button></div>`).join('');
  }
  html+=`<h3 style="margin:14px 0 4px;font-weight:normal;color:var(--pink-d)">${STORE.kind==='db'?'☁️ 내 계정에 보관한 세트':'💻 이 브라우저에 보관한 세트'}</h3>`;
  if(!setsCache.length){ box.innerHTML=html+'<div style="padding:6px 4px">아직 보관한 세트가 없어요. 위에서 지금 문제를 보관해 보세요!</div>'; return; }
  box.innerHTML=html+setsCache.map(x=>{
    const n=parseQuestions(x.questions||'').length;
    return `<div class="setcard ${x.name===S.settings.setName?'cur':''}">
      <div class="nm jp">${esc(x.name)}<span class="meta">${n}문제 · 모둠 ${(x.teams||[]).length}개 · ${fmtDate(x.updated)} 저장</span></div>
      <button class="btn primary" onclick="useSet('${x.id}')">▶ 이 문제로 시작</button>
      <button class="btn blue" onclick="editSet('${x.id}')">✏️ 고치기</button>
      <button class="btn" id="del_${x.id}" onclick="delSet('${x.id}')">🗑 삭제</button></div>`;
  }).join('');
}
async function saveCurrentSet(){
  const name=$('setName').value.trim(); if(!name){ toast('세트 이름을 써 주세요'); return; }
  const st=S.settings, old=setsCache.find(x=>x.name===name);
  const set={id:old?old.id:'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    name, title:st.title, subtitle:st.subtitle, teams:st.teams, questions:st.questions, shuffle:!!st.shuffle, updated:Date.now()};
  try{ await putSet(set); S.settings.setName=name; save(); toast(old?`'${name}' 세트를 새로 저장했어요`:`'${name}' 세트를 보관했어요`); await refreshSets(); }
  catch(e){ toast(e&&e.code==='quota_exceeded'?'보관함이 가득 찼어요. 안 쓰는 세트를 지워 주세요':'보관하지 못했어요. 다시 시도해 주세요'); }
}
function useRepoSet(id){ const x=(repoSets||[]).find(s=>s.id===id); if(!x) return;
  S.settings={...S.settings, questions:x.questions, setName:x.name, subtitle:x.name};
  closeMisc(); newGame(); toast(`'${x.name}' 세트로 새 게임 시작!`); }
function applySet(x){
  S.settings={title:x.title||DEFAULT_SETTINGS.title, subtitle:x.subtitle||'', teams:(x.teams&&x.teams.length?x.teams:DEFAULT_SETTINGS.teams).slice(),
    questions:x.questions||'', shuffle:!!x.shuffle, setName:x.name};
}
function useSet(id){ const x=setsCache.find(s=>s.id===id); if(!x) return; applySet(x); closeMisc(); newGame(); toast(`'${x.name}' 세트로 새 게임 시작!`); }
function editSet(id){ const x=setsCache.find(s=>s.id===id); if(!x) return; applySet(x); newGame(); openSettings(); toast(`'${x.name}' 세트를 불러왔어요. 고친 뒤 [문제 세트로 보관하기]를 누르세요`); }
async function delSet(id){
  const b=$('del_'+id);
  if(delArm!==id){ delArm=id; if(b){ b.textContent='정말 지울까요?'; b.style.background='var(--pink)'; } setTimeout(()=>{ if(delArm===id){ delArm=null; if($('del_'+id)){ $('del_'+id).textContent='🗑 삭제'; $('del_'+id).style.background=''; } } },3000); return; }
  delArm=null;
  try{ await removeSet(id); toast('세트를 지웠어요'); await refreshSets(); }catch(e){ toast('지우지 못했어요. 다시 시도해 주세요'); }
}

document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&$('miscOv').classList.contains('show'))closeMisc(); });
$('miscOv').addEventListener('click',e=>{ if(e.target.id==='miscOv')closeMisc(); });

const firstVisit=!load();
if(!S.game||!S.game.qs||S.game.scores.length!==S.settings.teams.length) newGame(); else render();
if(firstVisit) loadRepoSets().then(rs=>{ if(rs.length && !history.length && S.game.used.every(x=>!x)){ const x=rs[0]; S.settings={...S.settings,questions:x.questions,setName:x.name,subtitle:x.name}; newGame(); } });
</script>
